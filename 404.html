<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Página não encontrada — Deu Papo Podcast</title>
<meta name="robots" content="noindex" />
<link rel="icon" href="deupapo-logo.jpg" type="image/jpeg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Manrope:wght@400;500;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b0810;
    --ink:#f6f1ec;
    --ink-dim:#b6a9c4;
    --ink-faint:#7c6d8c;
    --line:#332843;
    --orange:#f5791c;
    --ink-on-orange:#170e07;
    --serif:'Fraunces', ui-serif, Georgia, serif;
    --sans:'Manrope', ui-sans-serif, system-ui, -apple-system, sans-serif;
    --mono:'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  }
  *{box-sizing:border-box;}
  html{background:var(--bg);}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px;
    background:
      radial-gradient(900px 560px at 82% 0%, rgba(245,121,28,.14), transparent 60%),
      radial-gradient(800px 620px at 10% 100%, rgba(141,129,163,.10), transparent 55%),
      var(--bg);
    color:var(--ink);
    font-family:var(--sans);
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:560px;text-align:center;}
  .badge{
    width:88px;height:88px;
    border-radius:999px;
    margin:0 auto 32px;
    overflow:hidden;
    box-shadow:0 0 0 1px var(--line), 0 30px 70px -30px rgba(0,0,0,.7);
  }
  .badge img{width:100%;height:100%;object-fit:cover;display:block;}
  .eyebrow{
    font-family:var(--mono);
    font-size:.72rem;
    letter-spacing:.16em;
    text-transform:uppercase;
    color:var(--orange);
    margin:0 0 18px;
  }
  h1{
    font-family:var(--serif);
    font-weight:600;
    font-size:clamp(1.8rem, 5vw, 2.6rem);
    line-height:1.15;
    margin:0 0 16px;
    text-wrap:balance;
  }
  p{
    font-size:1.02rem;
    line-height:1.6;
    color:var(--ink-dim);
    max-width:44ch;
    margin:0 auto 34px;
  }
  .cta-row{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;}
  .btn{
    display:inline-flex;align-items:center;gap:8px;
    padding:13px 22px;
    border-radius:999px;
    font-size:.92rem;
    font-weight:700;
    text-decoration:none;
    border:1px solid transparent;
    transition:transform .15s ease, opacity .15s ease, border-color .15s ease;
  }
  .btn:hover{transform:translateY(-1px);}
  .btn-solid{background:var(--orange);color:var(--ink-on-orange);}
  .btn-ghost{background:transparent;border-color:var(--line);color:var(--ink);}
  .btn-ghost:hover{border-color:var(--ink-faint);}
  .code{
    margin-top:44px;
    font-family:var(--mono);
    font-size:.72rem;
    letter-spacing:.06em;
    color:var(--ink-faint);
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="badge"><img src="deupapo-logo.jpg" alt="Deu Papo Podcast"></div>
    <p class="eyebrow">Erro 404</p>
    <h1>Esse papo ainda não rolou por aqui.</h1>
    <p>A página que você procura não existe ou saiu do ar. Volta pro início e continua o papo com a gente.</p>
    <div class="cta-row">
      <a class="btn btn-solid" href="/">Voltar ao início</a>
      <a class="btn btn-ghost" href="https://www.youtube.com/@deupapoo" target="_blank" rel="noopener">Assistir no YouTube</a>
    </div>
    <p class="code">página não encontrada</p>
  </div>
</body>
</html>
